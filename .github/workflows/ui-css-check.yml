name: UI CSS build check

on:
  push:
    paths:
      - "packages/reflow/ui/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "packages/reflow/ui/**"
      - "package.json"
      - "package-lock.json"

jobs:
  check-style-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: npm run build

      - name: Fail if style.css is stale
        run: |
          if ! git diff --exit-code -- packages/reflow/ui/style.css; then
            echo "::error::style.css is out of date — run 'npm run build' at the repo root and commit the result."
            exit 1
          fi
