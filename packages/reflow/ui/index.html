<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Reflow — API Explorer</title>
  <link rel="stylesheet" href="style.css" />
  <!-- YAML support, so the same panel accepts .yaml or .json specs -->
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <!-- app.js must run before Alpine's script: Alpine.start() fires as soon
       as its own deferred script executes if the document is already parsed,
       so reflowPanel needs to exist on window before that happens. -->
  <script type="module" src="app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body x-data="reflowPanel()" x-init="init()" class="m-0 h-screen grid grid-cols-[260px_1fr_380px] bg-bg text-text font-sans">

  <nav class="border-r border-border overflow-y-auto min-w-0">
    <div class="sticky top-0 bg-bg px-3 py-3 border-b border-border">
      <input type="text" class="w-full bg-panel border border-border text-text rounded-md px-2.5 py-1.5 font-mono text-sm" x-model="search" placeholder="Search endpoints…" />
    </div>
    <template x-for="(ops, tag) in filteredGroups()" :key="tag">
      <div>
        <h2 class="flex items-center justify-between text-xs uppercase tracking-wide text-muted px-4 pt-3 pb-1 m-0 cursor-pointer" @click="toggleTag(tag)">
          <span x-text="tag"></span>
          <span class="inline-block transition-transform duration-150" :class="isTagOpen(tag) ? 'rotate-0' : 'rotate-90'">›</span>
        </h2>
        <template x-if="isTagOpen(tag)">
          <div>
            <template x-for="op in ops" :key="op.operationId">
              <div
                class="flex items-center gap-2 px-4 py-1.5 text-sm cursor-pointer hover:bg-panel"
                :class="{ 'bg-panel border-l-2 border-accent': selected === op }"
                @click="select(op)"
              >
                <span class="font-bold text-xs w-12 text-center shrink-0" :class="'method-' + op.method.toLowerCase()" x-text="op.method"></span>
                <span x-text="op.path"></span>
              </div>
            </template>
          </div>
        </template>
      </div>
    </template>
  </nav>

  <main class="overflow-y-auto p-6 border-r border-border min-w-0">
    <p class="text-delete text-sm my-2" x-show="error" x-text="error"></p>

    <template x-if="!selected && !error">
      <p class="text-muted text-sm">Select an endpoint from the sidebar.</p>
    </template>

    <template x-if="selected">
      <div>
        <div class="flex items-center gap-3 mb-4 flex-wrap">
          <span class="font-bold text-xs w-12 text-center shrink-0" :class="'method-' + selected.method.toLowerCase()" x-text="selected.method"></span>
          <span class="font-mono text-base break-all" x-text="selected.path"></span>
        </div>
        <p class="text-base m-0" x-text="selected.summary"></p>
        <p class="text-muted text-sm mt-1" x-show="selected.description" x-text="selected.description"></p>

        <template x-if="selected.parameters.length">
          <section>
            <h3 class="text-xs uppercase tracking-wide text-muted mt-6 mb-2">Parameters</h3>
            <table class="w-full border-collapse text-sm mb-2">
              <thead>
                <tr>
                  <th class="text-left text-xs uppercase tracking-wide text-muted border-b border-border px-2 py-1.5">Name</th>
                  <th class="text-left text-xs uppercase tracking-wide text-muted border-b border-border px-2 py-1.5">In</th>
                  <th class="text-left text-xs uppercase tracking-wide text-muted border-b border-border px-2 py-1.5">Type</th>
                  <th class="text-left text-xs uppercase tracking-wide text-muted border-b border-border px-2 py-1.5">Required</th>
                  <th class="text-left text-xs uppercase tracking-wide text-muted border-b border-border px-2 py-1.5">Description</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="param in selected.parameters" :key="param.in + ':' + param.name">
                  <tr>
                    <td class="border-b border-border px-2 py-1.5 align-top font-mono" x-text="param.name"></td>
                    <td class="border-b border-border px-2 py-1.5 align-top">
                      <span class="text-[10px] uppercase tracking-wide px-1.5 py-0.5 rounded border border-border text-muted" :class="'badge-in-' + param.in" x-text="param.in"></span>
                    </td>
                    <td class="border-b border-border px-2 py-1.5 align-top" x-text="param.schema?.type || 'string'"></td>
                    <td class="border-b border-border px-2 py-1.5 align-top" x-text="param.required ? 'yes' : '—'"></td>
                    <td class="border-b border-border px-2 py-1.5 align-top" x-text="param.description || '—'"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </section>
        </template>

        <template x-if="selected.requestBodySchema">
          <section>
            <h3 class="text-xs uppercase tracking-wide text-muted mt-6 mb-2">Request body</h3>
            <table class="w-full border-collapse text-sm mb-2">
              <thead>
                <tr>
                  <th class="text-left text-xs uppercase tracking-wide text-muted border-b border-border px-2 py-1.5">Field</th>
                  <th class="text-left text-xs uppercase tracking-wide text-muted border-b border-border px-2 py-1.5">Type</th>
                  <th class="text-left text-xs uppercase tracking-wide text-muted border-b border-border px-2 py-1.5">Required</th>
                  <th class="text-left text-xs uppercase tracking-wide text-muted border-b border-border px-2 py-1.5">Description</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="field in describeSchema(selected.requestBodySchema)" :key="field.name">
                  <tr>
                    <td class="border-b border-border px-2 py-1.5 align-top font-mono" x-text="field.name"></td>
                    <td class="border-b border-border px-2 py-1.5 align-top" x-text="field.format ? field.type + ' (' + field.format + ')' : field.type"></td>
                    <td class="border-b border-border px-2 py-1.5 align-top" x-text="field.required ? 'yes' : '—'"></td>
                    <td class="border-b border-border px-2 py-1.5 align-top" x-text="field.description || '—'"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </section>
        </template>

        <template x-if="selected.responses.length">
          <section>
            <h3 class="text-xs uppercase tracking-wide text-muted mt-6 mb-2">Responses</h3>
            <template x-for="res in selected.responses" :key="res.status">
              <div class="mb-4">
                <div class="flex items-center gap-2 text-sm mb-1.5">
                  <span class="text-[10px] uppercase tracking-wide px-1.5 py-0.5 rounded border border-border" :class="res.status[0] === '2' ? 'status-ok' : 'status-fail'" x-text="res.status"></span>
                  <span x-text="res.description"></span>
                </div>
                <template x-if="res.schema">
                  <table class="w-full border-collapse text-sm mb-2">
                    <thead>
                      <tr>
                        <th class="text-left text-xs uppercase tracking-wide text-muted border-b border-border px-2 py-1.5">Field</th>
                        <th class="text-left text-xs uppercase tracking-wide text-muted border-b border-border px-2 py-1.5">Type</th>
                        <th class="text-left text-xs uppercase tracking-wide text-muted border-b border-border px-2 py-1.5">Required</th>
                        <th class="text-left text-xs uppercase tracking-wide text-muted border-b border-border px-2 py-1.5">Description</th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="field in describeSchema(res.schema)" :key="field.name">
                        <tr>
                          <td class="border-b border-border px-2 py-1.5 align-top font-mono" x-text="field.name"></td>
                          <td class="border-b border-border px-2 py-1.5 align-top" x-text="field.format ? field.type + ' (' + field.format + ')' : field.type"></td>
                          <td class="border-b border-border px-2 py-1.5 align-top" x-text="field.required ? 'yes' : '—'"></td>
                          <td class="border-b border-border px-2 py-1.5 align-top" x-text="field.description || '—'"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </template>
              </div>
            </template>
          </section>
        </template>
      </div>
    </template>
  </main>

  <aside class="overflow-y-auto p-6 min-w-0">
    <template x-if="!selected">
      <p class="text-muted text-sm">Nothing to try yet.</p>
    </template>

    <template x-if="selected">
      <div>
        <div class="flex items-center gap-3 bg-panel border border-border rounded-md px-3 py-2 mb-4">
          <span class="font-bold text-xs w-12 text-center shrink-0" :class="'method-' + selected.method.toLowerCase()" x-text="selected.method"></span>
          <span class="flex-1 font-mono text-[0.9rem] overflow-x-auto whitespace-nowrap" x-text="resolvedPath()"></span>
          <button class="bg-accent text-white border-0 rounded-md px-5 py-2 font-semibold cursor-pointer shrink-0 ml-auto disabled:opacity-60 disabled:cursor-default" @click="send()" :disabled="loading">
            <span x-text="loading ? 'Sending…' : 'Send'"></span>
          </button>
        </div>

        <div class="flex gap-1 border-b border-border mb-4">
          <button class="bg-transparent border-0 border-b-2 border-transparent text-muted px-3 py-2 -mb-px text-xs cursor-pointer hover:text-text" :class="{ 'text-text border-accent': activeTab === 'params' }" @click="activeTab = 'params'">Params</button>
          <button class="bg-transparent border-0 border-b-2 border-transparent text-muted px-3 py-2 -mb-px text-xs cursor-pointer hover:text-text" :class="{ 'text-text border-accent': activeTab === 'headers' }" @click="activeTab = 'headers'">Headers</button>
          <button class="bg-transparent border-0 border-b-2 border-transparent text-muted px-3 py-2 -mb-px text-xs cursor-pointer hover:text-text" :class="{ 'text-text border-accent': activeTab === 'auth' }" @click="activeTab = 'auth'">Auth</button>
          <button class="bg-transparent border-0 border-b-2 border-transparent text-muted px-3 py-2 -mb-px text-xs cursor-pointer hover:text-text" x-show="selected.requestBodySchema" :class="{ 'text-text border-accent': activeTab === 'body' }" @click="activeTab = 'body'">Body</button>
        </div>

        <template x-if="activeTab === 'params'">
          <div class="mb-4">
            <template x-if="selected.parameters.filter((p) => p.in === 'path' || p.in === 'query').length === 0">
              <p class="text-muted text-sm">No path or query parameters.</p>
            </template>
            <div class="grid grid-cols-[max-content_1fr] gap-x-3 gap-y-2 mb-4 items-center">
              <template x-for="param in selected.parameters.filter((p) => p.in === 'path' || p.in === 'query')" :key="param.in + ':' + param.name">
                <template x-if="true">
                  <div style="display:contents">
                    <label class="text-muted text-sm flex items-center gap-1.5">
                      <span x-text="param.name"></span>
                      <span class="text-[10px] uppercase tracking-wide px-1.5 py-0.5 rounded border border-border text-muted" :class="'badge-in-' + param.in" x-text="param.in"></span>
                      <span class="text-delete" x-show="param.required">*</span>
                    </label>
                    <input type="text" class="bg-panel border border-border text-text rounded-md px-2.5 py-1.5 font-mono text-sm" x-model="paramValues[param.name]" />
                  </div>
                </template>
              </template>
            </div>
          </div>
        </template>

        <template x-if="activeTab === 'headers'">
          <div class="mb-4">
            <template x-if="selected.parameters.filter((p) => p.in === 'header' || p.in === 'cookie').length">
              <div class="grid grid-cols-[max-content_1fr] gap-x-3 gap-y-2 mb-4 items-center">
                <template x-for="param in selected.parameters.filter((p) => p.in === 'header' || p.in === 'cookie')" :key="param.in + ':' + param.name">
                  <template x-if="true">
                    <div style="display:contents">
                      <label class="text-muted text-sm flex items-center gap-1.5">
                        <span x-text="param.name"></span>
                        <span class="text-[10px] uppercase tracking-wide px-1.5 py-0.5 rounded border border-border text-muted" :class="'badge-in-' + param.in" x-text="param.in"></span>
                        <span class="text-delete" x-show="param.required">*</span>
                      </label>
                      <input type="text" class="bg-panel border border-border text-text rounded-md px-2.5 py-1.5 font-mono text-sm" x-model="paramValues[param.name]" />
                    </div>
                  </template>
                </template>
              </div>
            </template>

            <p class="text-muted text-xs my-1" x-show="selected.parameters.some((p) => p.in === 'cookie')">
              Cookie values are set via document.cookie before sending (same-origin only) — fetch() can't set a Cookie header directly.
            </p>

            <div class="flex flex-col gap-2 mb-2">
              <template x-for="(row, index) in customHeaders" :key="index">
                <div class="grid grid-cols-[auto_1fr_1fr_auto] gap-2 items-center">
                  <input type="checkbox" class="accent-accent" x-model="row.enabled" />
                  <input type="text" class="bg-panel border border-border text-text rounded-md px-2.5 py-1.5 font-mono text-sm" x-model="row.key" placeholder="Header name" />
                  <input type="text" class="bg-panel border border-border text-text rounded-md px-2.5 py-1.5 font-mono text-sm" x-model="row.value" placeholder="Value" />
                  <button class="bg-transparent border border-border text-muted rounded w-6 h-6 leading-none cursor-pointer hover:text-delete hover:border-delete" @click="removeHeaderRow(index)">×</button>
                </div>
              </template>
            </div>
            <button class="bg-transparent border border-dashed border-border text-muted rounded-md px-2.5 py-1 text-xs cursor-pointer hover:text-text hover:border-accent" @click="addHeaderRow()">+ Add header</button>
          </div>
        </template>

        <template x-if="activeTab === 'auth'">
          <div class="mb-4 flex flex-col gap-2 max-w-[420px]">
            <label class="text-muted text-xs uppercase tracking-wide mt-1.5">Type</label>
            <select class="bg-panel border border-border text-text rounded-md px-2.5 py-1.5 font-mono text-sm" x-model="auth.type">
              <option value="none">None</option>
              <option value="bearer">Bearer Token</option>
              <option value="basic">Basic Auth</option>
              <option value="apiKey">API Key</option>
              <option value="oauth2">OAuth2 (Client Credentials)</option>
            </select>

            <template x-if="auth.type === 'bearer'">
              <div class="flex flex-col gap-2">
                <label class="text-muted text-xs uppercase tracking-wide mt-1.5">Token</label>
                <input type="text" class="bg-panel border border-border text-text rounded-md px-2.5 py-1.5 font-mono text-sm" x-model="auth.token" placeholder="access token" />
              </div>
            </template>

            <template x-if="auth.type === 'basic'">
              <div class="flex flex-col gap-2">
                <label class="text-muted text-xs uppercase tracking-wide mt-1.5">Username</label>
                <input type="text" class="bg-panel border border-border text-text rounded-md px-2.5 py-1.5 font-mono text-sm" x-model="auth.username" />
                <label class="text-muted text-xs uppercase tracking-wide mt-1.5">Password</label>
                <input type="password" class="bg-panel border border-border text-text rounded-md px-2.5 py-1.5 font-mono text-sm" x-model="auth.password" />
              </div>
            </template>

            <template x-if="auth.type === 'apiKey'">
              <div class="flex flex-col gap-2">
                <label class="text-muted text-xs uppercase tracking-wide mt-1.5">Name</label>
                <input type="text" class="bg-panel border border-border text-text rounded-md px-2.5 py-1.5 font-mono text-sm" x-model="auth.apiKeyName" placeholder="X-API-Key" />
                <label class="text-muted text-xs uppercase tracking-wide mt-1.5">In</label>
                <select class="bg-panel border border-border text-text rounded-md px-2.5 py-1.5 font-mono text-sm" x-model="auth.apiKeyIn">
                  <option value="header">header</option>
                  <option value="query">query</option>
                </select>
                <label class="text-muted text-xs uppercase tracking-wide mt-1.5">Value</label>
                <input type="text" class="bg-panel border border-border text-text rounded-md px-2.5 py-1.5 font-mono text-sm" x-model="auth.apiKeyValue" />
              </div>
            </template>

            <template x-if="auth.type === 'oauth2'">
              <div class="flex flex-col gap-2">
                <label class="text-muted text-xs uppercase tracking-wide mt-1.5">Token URL</label>
                <input type="text" class="bg-panel border border-border text-text rounded-md px-2.5 py-1.5 font-mono text-sm" x-model="auth.oauth2.tokenUrl" />
                <label class="text-muted text-xs uppercase tracking-wide mt-1.5">Client ID</label>
                <input type="text" class="bg-panel border border-border text-text rounded-md px-2.5 py-1.5 font-mono text-sm" x-model="auth.oauth2.clientId" />
                <label class="text-muted text-xs uppercase tracking-wide mt-1.5">Client Secret</label>
                <input type="password" class="bg-panel border border-border text-text rounded-md px-2.5 py-1.5 font-mono text-sm" x-model="auth.oauth2.clientSecret" />
                <label class="text-muted text-xs uppercase tracking-wide mt-1.5">Scope</label>
                <input type="text" class="bg-panel border border-border text-text rounded-md px-2.5 py-1.5 font-mono text-sm" x-model="auth.oauth2.scope" placeholder="optional" />
                <button class="bg-transparent border border-border text-text rounded-md px-2.5 py-1 text-xs cursor-pointer hover:bg-panel self-start" @click="fetchOAuth2Token()">Fetch token</button>
                <p class="text-muted text-xs my-1" x-show="auth.oauth2.accessToken" x-text="'Token: ' + auth.oauth2.accessToken.slice(0, 24) + '…'"></p>
                <p class="text-delete text-sm my-2" x-show="oauth2Error" x-text="oauth2Error"></p>
              </div>
            </template>
          </div>
        </template>

        <template x-if="activeTab === 'body' && selected.requestBodySchema">
          <div class="mb-4">
            <div class="relative w-full min-h-[220px] bg-panel border border-border rounded-md">
              <pre
                class="absolute inset-0 m-0 p-2.5 font-mono text-sm leading-snug whitespace-pre-wrap break-words overflow-auto text-text pointer-events-none"
                x-ref="bodyHighlight"
                x-html="highlightJson(bodyText) + '\n'"
              ></pre>
              <textarea
                class="absolute inset-0 m-0 p-2.5 font-mono text-sm leading-snug whitespace-pre-wrap break-words overflow-auto bg-transparent border-0 text-transparent caret-text resize-none"
                x-model="bodyText"
                spellcheck="false"
                @scroll="$refs.bodyHighlight.scrollTop = $event.target.scrollTop; $refs.bodyHighlight.scrollLeft = $event.target.scrollLeft"
              ></textarea>
            </div>
          </div>
        </template>

        <template x-if="response">
          <div class="mt-4">
            <div class="flex items-center gap-3 mb-2">
              <span class="font-semibold text-sm" :class="response.ok ? 'status-ok' : 'status-fail'" x-text="response.status"></span>
              <span class="text-muted text-sm" x-text="response.durationMs + ' ms'"></span>
              <button class="bg-transparent border border-border text-text rounded-md px-2.5 py-1 text-xs cursor-pointer hover:bg-panel ml-auto" @click="copyResponse()" x-text="copied ? 'Copied' : 'Copy'"></button>
            </div>

            <div class="flex gap-1 border-b border-border mb-4">
              <button class="bg-transparent border-0 border-b-2 border-transparent text-muted px-3 py-2 -mb-px text-xs cursor-pointer hover:text-text" :class="{ 'text-text border-accent': responseTab === 'body' }" @click="responseTab = 'body'">Body</button>
              <button class="bg-transparent border-0 border-b-2 border-transparent text-muted px-3 py-2 -mb-px text-xs cursor-pointer hover:text-text" :class="{ 'text-text border-accent': responseTab === 'headers' }" @click="responseTab = 'headers'">
                <span x-text="'Headers (' + response.headers.length + ')'"></span>
              </button>
            </div>

            <template x-if="responseTab === 'body'">
              <pre class="bg-panel-alt border border-border rounded-md p-3 whitespace-pre-wrap font-mono text-sm m-0" x-html="highlightJson(response.body)"></pre>
            </template>

            <template x-if="responseTab === 'headers'">
              <table class="w-full border-collapse text-sm mb-2">
                <tbody>
                  <template x-for="h in response.headers" :key="h.name">
                    <tr>
                      <td class="border-b border-border px-2 py-1.5 align-top font-mono" x-text="h.name"></td>
                      <td class="border-b border-border px-2 py-1.5 align-top" x-text="h.value"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </template>
          </div>
        </template>
      </div>
    </template>
  </aside>

</body>
</html>
